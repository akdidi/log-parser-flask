[supervisord]
nodaemon=true

[program:flask]
command=python /app/app.py
autostart=true
autorestart=true
stdout_logfile=/app/logs/flask.log
stderr_logfile=/app/logs/flask_error.log

[program:prometheus]
command=prometheus --config.file=/app/prometheus.yml --web.listen-address=:9090
autostart=true
autorestart=true
stdout_logfile=/app/logs/prometheus.log
stderr_logfile=/app/logs/prometheus_error.log

[program:grafana]
command=grafana-server --homepath=/usr/share/grafana --config=/etc/grafana/grafana.ini --packaging=docker
autostart=true
autorestart=true
stdout_logfile=/app/logs/grafana.log
stderr_logfile=/app/logs/grafana_error.log