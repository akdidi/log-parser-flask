[supervisord]
nodaemon=true

[program:flask]
command=python /app/app.py
autostart=true
autorestart=true
stdout_logfile=/app/logs/flask.log
stderr_logfile=/app/logs/flask_error.log

[program:prometheus]
command=/usr/local/bin/prometheus --config.file=/app/prometheus.yml --web.listen-address=:9090
autostart=true
autorestart=true
stdout_logfile=/app/logs/prometheus.log
stderr_logfile=/app/logs/prometheus_error.log

[program:grafana]
command=/app/grafana/bin/grafana-server --homepath=/app/grafana --packaging=tar
autostart=true
autorestart=true
stdout_logfile=/app/logs/grafana.log
stderr_logfile=/app/logs/grafana_error.log